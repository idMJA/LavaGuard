[package]
name = "lavaguard"
version = "0.1.0"
edition = "2021"
description = "YT cipher and BotGuard PoToken challenge solver in Rust"
license = "MIT"
repository = "https://github.com/idMJA/LavaGuard"
keywords = ["youtube", "cipher", "botguard", "lavalink", "potoken"]
categories = ["network-programming", "web-programming", "multimedia"]

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rquickjs = { version = "0.13", features = ["classes", "properties", "macro"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
ureq = { version = "2.10", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
regex = "1.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
